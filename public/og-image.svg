<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow effects -->
  <circle cx="950" cy="200" r="250" fill="#c9a84c" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="200" fill="#3b82f6" opacity="0.10" filter="url(#glow)"/>

  <!-- Border container -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Status badge -->
  <rect x="80" y="90" width="220" height="36" rx="18" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <circle cx="102" cy="108" r="5" fill="#22c55e"/>
  <text x="118" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a3a3a3">Open to Opportunities</text>

  <!-- Name -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#accentGrad)">Nitin Verma</text>

  <!-- Role -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#f5f5f5">Full Stack MERN Developer</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#c9a84c">Jaipur, India • React • Node.js • Express • MongoDB</text>

  <!-- Bio -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a3a3a3">Building production-grade web applications with clean architecture,</text>
  <text x="80" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a3a3a3">scalable REST APIs, AWS EC2 deployment &amp; AI workflows.</text>

  <!-- Tech tags -->
  <g transform="translate(80, 465)">
    <rect x="0" y="0" width="110" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="55" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">React.js</text>
    <rect x="125" y="0" width="110" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="180" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">Node.js</text>
    <rect x="250" y="0" width="110" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="305" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">MongoDB</text>
    <rect x="375" y="0" width="120" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="435" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">Express.js</text>
    <rect x="510" y="0" width="130" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="575" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">Tailwind CSS</text>
    <rect x="655" y="0" width="120" height="38" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/><text x="715" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9a84c" text-anchor="middle">AWS EC2</text>
  </g>
</svg>
